# AI Runtime CLI workload spec — XGBoost single-GPU training on Forest CoverType.
#
# Run it with:
#   COPYFILE_DISABLE=1 air run --file 02_cli/train_singlegpu.yaml --watch --profile <your-profile>
#
# It runs 02_cli/01_train_singlegpu.py. The notebook-optimized equivalent, for import + Run All,
# is 01_notebook/01_train_singlegpu.py. Dependencies are declared here (not via %pip).

experiment_name: xgboost-classification-singlegpu
max_retries: 0

environment:
  # Version "4" ships Python 3.12, torch 2.7.1+cu126, mlflow, scikit-learn and
  # serverless_gpu preinstalled. We add xgboost and scikit-learn. Versions are pinned
  # to ensure compatibility and avoid resolver conflicts.
  version: "4"
  dependencies:
    - "xgboost>=2.1,<3"
    - "scikit-learn>=1.3,<2"

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..

command: python $CODE_SOURCE_PATH/02_cli/01_train_singlegpu.py
