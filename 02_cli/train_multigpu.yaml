# AI Runtime CLI workload spec — XGBoost multi-GPU parallel hyperparameter search (8×H100).
#
# Run it with:
#   COPYFILE_DISABLE=1 air run --file 02_cli/train_multigpu.yaml --watch --profile <your-profile>
#
# It runs 02_cli/02_train_multigpu.py (notebook equivalent: 01_notebook/02_train_multigpu.py).
# It trains many XGBoost trials concurrently — one per GPU — via a thread pool (XGBoost releases
# the GIL during training), then registers the best model. No cluster framework or torchrun needed.

experiment_name: xgboost-hpo-multigpu
max_retries: 0
timeout_minutes: 60

environment:
  version: "4"
  dependencies:
    - "xgboost>=2.1"
    - "scikit-learn>=1.3"

# UC target as workload env vars — override without editing files:
#   air run ... --override env_variables.UC_CATALOG=<your-catalog>
env_variables:
  UC_CATALOG: main
  UC_SCHEMA: air_samples

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..

command: python $CODE_SOURCE_PATH/02_cli/02_train_multigpu.py
