# AI Runtime CLI workload spec — XGBoost GPU batch inference.
#
# Requires a model already registered to Unity Catalog by 01 or 02.
# Run it with:
#   COPYFILE_DISABLE=1 air run --file 02_cli/batch_inference.yaml --watch --profile <your-profile>

experiment_name: xgboost-classification-batch-inference
max_retries: 0

environment:
  # Version "4" preinstalls. We add xgboost and scikit-learn (for the dataset + metrics).
  version: "4"
  dependencies:
    - "xgboost>=2.1"
    - "scikit-learn>=1.3"

# UC target as workload env vars — override without editing files:
#   air run ... --override env_variables.UC_CATALOG=<your-catalog>
env_variables:
  UC_CATALOG: main
  UC_SCHEMA: air_samples

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..

command: python $CODE_SOURCE_PATH/02_cli/02_batch_inference.py
